<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LAZR DECO — Espace de gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --white:#FFFFFF;--cream:#FFF9F3;--sand:#F4EEE7;--line:#E6DED4;--bg:#F7F4F0;
  --ink:#101826;--ink-2:#1C2638;--edge:#2E3A50;--black:#020200;
  --body:#2A3441;--gray:#4F5B6B;
  --on-dark:#FFFFFF;--on-dark-2:#E4E9F1;--on-dark-3:#C3CEDD;
  --accent:#0B4F80;--err:#A3123F;--ok:#08555F;
  --mag:#E8175D;--mag-l:#A3123F;--mag-f:#FF7AA2;--mag-t:#FFE6EF;
  --cya:#12A8B8;--cya-l:#08555F;--cya-f:#3FD0DC;--cya-t:#DDF6F8;
  --ora:#F7A21B;--ora-l:#7F3D00;--ora-f:#FFB23E;--ora-t:#FFF0D9;
  --blu:#1477B8;--blu-l:#0B4F80;--blu-f:#6BB8EC;--blu-t:#E1EFFA;
  --grad:linear-gradient(90deg,#F7A21B,#E8175D,#12A8B8,#1477B8);
  --r:999px;--rad:18px;--rad-s:12px;
  --display:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:var(--accent)}a:hover{color:var(--ink)}
h1,h2,h3{font-family:var(--display);color:var(--ink);font-weight:800;line-height:1.1;margin:0}
h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[data-c=mag]{--c:var(--mag);--c-l:var(--mag-l);--c-f:var(--mag-f);--c-t:var(--mag-t)}
[data-c=cya]{--c:var(--cya);--c-l:var(--cya-l);--c-f:var(--cya-f);--c-t:var(--cya-t)}
[data-c=ora]{--c:var(--ora);--c-l:var(--ora-l);--c-f:var(--ora-f);--c-t:var(--ora-t)}
[data-c=blu]{--c:var(--blu);--c-l:var(--blu-l);--c-f:var(--blu-f);--c-t:var(--blu-t)}

/* Connexion */
.login{min-height:100vh;background:var(--black);display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.login::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--grad)}
.login .box{width:min(460px,100%);display:flex;flex-direction:column;gap:18px;color:var(--on-dark)}
.login img{width:170px;height:170px;object-fit:contain;align-self:center}
.login h1{color:var(--on-dark);font-size:1.9rem;text-align:center}
.login .card{background:var(--white);color:var(--body);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:none}
.login .demo{background:var(--ink);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px}
.login .demo p{color:var(--on-dark-2);font-size:.9rem}
.login .demo .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login .note{font-size:.85rem;color:var(--on-dark-3);text-align:center}

/* Structure */
header.top{position:sticky;top:0;z-index:300;background:#FAF9F7;box-shadow:0 1px 0 var(--line)}
header.top .in{display:flex;align-items:center;gap:16px;height:66px;padding:0 24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{height:54px;width:auto;display:block}
.brand span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);white-space:nowrap;font-weight:700}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:0}
.who .mail{font-size:.88rem;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:var(--r);font-size:.78rem;font-weight:700;letter-spacing:.02em;background:var(--blu-t);color:var(--ink);white-space:nowrap}
.chip.r-admin{background:var(--mag-f)}
.demo-band{background:var(--ora-f);color:var(--ink);font-weight:700;font-size:.85rem;text-align:center;padding:6px 16px}
.filet{height:5px;background:var(--grad)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 71px)}
nav#sidebar{background:var(--ink);padding:12px}
nav#sidebar .links{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
nav#sidebar .sec{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--on-dark-3);padding:14px 14px 4px;font-weight:700}
nav#sidebar a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 14px;border-radius:var(--rad-s);color:var(--on-dark-2);text-decoration:none;font-weight:600;font-size:.9rem;cursor:pointer}
nav#sidebar a:hover{background:var(--ink-2);color:var(--on-dark)}
nav#sidebar a.active{background:var(--c-f,var(--on-dark));color:var(--ink)}
nav#sidebar a .n{font-size:.75rem;min-width:24px;padding:2px 8px;border-radius:var(--r);background:var(--ora-f);color:var(--ink);text-align:center}
.mobilebar,.drawer-head{display:none}
.backdrop{position:fixed;inset:0;background:rgba(5,13,27,.55);z-index:350;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.backdrop.on{opacity:1;visibility:visible}
main{padding:28px 32px 64px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:2rem}
.head p{color:var(--gray);margin-top:4px;max-width:720px}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}

/* Éléments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--r);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid transparent;white-space:nowrap}
.btn.primary{background:var(--mag-l);color:var(--on-dark)}
.btn.primary:hover{background:#8A0F35;color:var(--on-dark)}
.btn.dark{background:var(--ink);color:var(--on-dark)}
.btn.dark:hover{background:var(--ink-2);color:var(--on-dark)}
.btn.outline{background:var(--white);color:var(--ink);border-color:var(--ink)}
.btn.outline:hover{background:var(--ink);color:var(--on-dark)}
.btn.light{background:var(--ora-f);color:var(--ink)}
.btn.danger{background:var(--white);color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err);color:var(--on-dark)}
.btn.small{min-height:36px;padding:0 14px;font-size:.85rem}
.btn[disabled]{background:var(--sand);color:var(--gray);border-color:var(--line);cursor:not-allowed}
.card{background:var(--white);border-radius:var(--rad);box-shadow:0 0 0 1px var(--line);padding:22px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.dv-grid{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{border-radius:var(--rad);padding:18px 20px;background:var(--c-f,var(--white));color:var(--ink);display:flex;flex-direction:column;gap:4px;text-decoration:none;min-width:0}
.kpi b{font-family:var(--display);font-weight:900;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-weight:600;font-size:.88rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.85rem;font-weight:700;color:var(--ink)}
.field input,.field select,.field textarea,.tools input,.tools select,.inl{font:inherit;font-size:16px;color:var(--ink);background:var(--white);border:2px solid var(--line);border-radius:var(--rad-s);padding:8px 12px;min-height:44px;width:100%}
.inl{width:auto;min-height:38px;padding:4px 8px}
.field textarea{resize:vertical;min-height:90px}
.field textarea.long{min-height:320px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus,.tools input:focus,.tools select:focus,.inl:focus{border-color:var(--ink);outline:none}
.hint{font-size:.82rem;color:var(--gray)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--mag-l);flex-shrink:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tools input{max-width:320px}.tools select{max-width:240px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{min-height:40px;padding:0 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--white);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--on-dark)}
.tbl{width:100%;border-collapse:collapse;background:var(--white);font-size:.92rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);padding:12px 14px;border-bottom:2px solid var(--line);background:var(--cream);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.go{cursor:pointer}
.tbl tr.go:hover td{background:var(--cream)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .muted,.muted{color:var(--gray)}
.tbl td.c{text-align:center}
.wrapt{overflow-x:auto;border-radius:var(--rad);box-shadow:0 0 0 1px var(--line);position:relative}
/* Tableaux adaptatifs : passent en fiches dès qu'ils ne tiennent plus en largeur */
.wrapt.stack{overflow:visible;box-shadow:none;border-radius:0}
.wrapt.stack .tbl{background:transparent}
.wrapt.stack .tbl,.wrapt.stack tbody,.wrapt.stack tr,.wrapt.stack td,.wrapt.stack tbody th{display:block;width:100%}
.wrapt.stack thead,.wrapt.stack caption{display:none}
.wrapt.stack tr{background:var(--white);border-radius:var(--rad-s);box-shadow:0 0 0 1px var(--line);margin-bottom:10px;padding:4px 0;overflow:hidden}
.wrapt.stack td,.wrapt.stack tbody th{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;border-bottom:1px solid var(--line);padding:9px 14px;white-space:normal;min-width:0!important;background:transparent}
.wrapt.stack td>*{min-width:0}
.wrapt.stack td:last-child{border-bottom:0}
.wrapt.stack td[data-l]::before{content:attr(data-l);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:700;text-align:left;flex-shrink:0}
.wrapt.stack tr>:first-child{display:block;text-align:left;font-size:.95rem}
.wrapt.stack tr>:first-child::before{content:none}
.wrapt.stack tr>td:first-child:has(.thumb){display:flex;justify-content:flex-start}
.wrapt.stack .barcell{width:100%}.wrapt.stack .barcell .bar{flex:1}
.wrapt.stack .actions{justify-content:flex-end}
.wrapt.stack tr>:first-child .actions{justify-content:flex-start}
.wrapt.stack td[colspan]{display:block;text-align:left}
.wrapt.stack td[colspan]::before{content:none}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--sand);display:block}
.thumb svg{width:48px;height:48px}
.st{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:var(--r);font-size:.78rem;font-weight:700;color:var(--ink);background:var(--sand);white-space:nowrap}
.st.demande,.st.en_attente,.st.a_faire{background:var(--ora-f)}.st.devis_envoye,.st.bat_envoye{background:var(--blu-t)}.st.valide,.st.envoye{background:var(--cya-t)}.st.en_production,.st.en_cours{background:var(--cya-f)}.st.prete{background:var(--blu-f)}.st.livree,.st.termine,.st.on{background:#BFE8D6}.st.annulee,.st.remplace,.st.annule,.st.off{color:var(--gray)}.st.correction,.st.erreur{background:var(--mag-t);color:var(--err)}
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.msg{font-weight:700;font-size:.9rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.prev{display:flex;flex-direction:column;gap:10px;align-items:center}
.prev .media{width:220px;height:220px;max-width:100%;border-radius:var(--rad);overflow:hidden;background:var(--c-f,var(--sand));display:flex;align-items:center;justify-content:center}
.prev .media img{width:100%;height:100%;object-fit:cover}
.prev .media svg{width:80%}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.sum .v{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sum .big{font-family:var(--display);font-size:1.5rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.empty{padding:36px;text-align:center;color:var(--gray)}
.diff{font-size:.82rem;color:var(--gray);max-width:420px;word-break:break-word}
.diff b{color:var(--ink)}
.matrix th,.matrix td{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix input{width:20px;height:20px;accent-color:var(--mag-l)}
.matrix .na{color:var(--gray)}
.matrix tbody th{text-transform:none;letter-spacing:0;font-size:.92rem;background:var(--white);border-bottom:1px solid var(--line);white-space:normal}
.bar{height:10px;border-radius:5px;background:var(--cya-f);min-width:2px}
.barcell{width:40%}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--white);border-radius:var(--rad);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.col h2{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem}
.job{border-radius:var(--rad-s);padding:12px 14px;background:var(--cream);box-shadow:inset 5px 0 0 var(--c,var(--line));display:flex;flex-direction:column;gap:6px}
.job b{color:var(--ink)}
.medias{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.media-it{background:var(--white);border-radius:var(--rad-s);box-shadow:0 0 0 1px var(--line);overflow:hidden;display:flex;flex-direction:column}
.media-it img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--sand);display:block;max-width:100%}
.media-it div{padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;word-break:break-all}
.md-view{background:var(--white);border-radius:var(--rad);box-shadow:0 0 0 1px var(--line);padding:22px;max-width:760px}
.md-view h2{font-size:1.3rem;margin:18px 0 8px}.md-view h3{margin:14px 0 6px}
.md-view p{margin:0 0 10px}.md-view ul{margin:0 0 10px;padding-left:20px}
.md-view .md-note{background:var(--ora-t);border-radius:var(--rad-s);padding:10px 14px;color:var(--ink)}
.order-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rad-s);background:var(--cream);flex-wrap:wrap}
.order-row .nm{flex:1;font-weight:700;color:var(--ink);min-width:160px}
.mail-body{white-space:pre-wrap;font-size:.86rem;background:var(--cream);border-radius:var(--rad-s);padding:12px;margin-top:8px;color:var(--body)}
.toast{position:fixed;bottom:24px;right:24px;z-index:600;background:var(--ink);color:var(--on-dark);padding:14px 20px;border-radius:var(--rad-s);font-weight:700;box-shadow:0 10px 30px rgba(16,24,38,.3);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:440px}
.toast.on{opacity:1;transform:none}
.toast.err{background:var(--err)}
.modal{position:fixed;inset:0;z-index:550;background:rgba(5,13,27,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--white);border-radius:22px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal .box p{color:var(--body)}
.ro-grid{grid-template-columns:minmax(0,1fr) minmax(0,2fr);align-items:start}

@media(max-width:1100px){.dv-grid{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr}.ro-grid{grid-template-columns:1fr}}
@media(max-width:900px){
  body.nav-open{overflow:hidden}
  header.top .in{height:56px;padding:0 16px}
  .brand img{height:44px}
  .brand span,.who .mail{display:none}
  .layout{display:block}
  .mobilebar{display:flex;align-items:center;gap:12px;position:sticky;top:61px;z-index:280;background:var(--white);border-bottom:1px solid var(--line);padding:9px 16px}
  .mobilebar .mb-lbl{flex:1;min-width:0}
  .mobilebar .mb-where{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);display:block}
  .mobilebar .mb-title{font-weight:700;color:var(--ink);font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mobilebar .mb-btn{flex-shrink:0;min-height:40px;padding:0 18px;font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;background:var(--ink);color:var(--on-dark);border:none;border-radius:var(--r);cursor:pointer}
  nav#sidebar{position:fixed;top:0;left:0;bottom:0;height:100dvh;width:min(86vw,330px);transform:translateX(-101%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:400;overscroll-behavior:contain;overflow-y:auto;padding:0 0 24px}
  nav#sidebar.open{transform:none;box-shadow:14px 0 40px rgba(5,13,27,.4)}
  nav#sidebar .links{position:static;padding:8px 12px}
  .drawer-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--ink);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--edge)}
  .drawer-head .dh-t{font-family:var(--display);color:var(--on-dark);font-weight:800}
  .drawer-head .dh-x{margin-left:auto;min-height:38px;padding:0 14px;color:var(--on-dark);font:inherit;font-weight:700;background:transparent;border:1px solid var(--on-dark-3);border-radius:var(--r);cursor:pointer}
  nav#sidebar a{padding:11px 18px;min-height:44px;font-size:.9rem}
  main{padding:20px 16px 56px}
  .head h1{font-size:1.6rem}
  .btn{min-height:42px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  .nav-btns{flex-direction:column-reverse;align-items:stretch}
  .nav-btns .btn{width:100%}
  .field input,.field textarea,.field select{font-size:16px}
  .toast{left:16px;right:16px;width:auto;text-align:center;max-width:none}
  #ladd{grid-template-columns:1fr!important}
}
@media(max-width:380px){main{padding:16px 13px 56px}nav#sidebar{width:92vw}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<div id="login-view" class="login" hidden></div>

<div id="app-view" hidden>
  <div class="demo-band" id="demo-band" hidden>Mode démonstration : les modifications ne sont pas enregistrées</div>
  <header class="top"><div class="in">
    <a class="brand" href="#/tableau"><img id="brand-logo" src="logo-lazerdeco-blanc.png" alt="LAZR DECO, tableau de bord"><span>Espace de gestion</span></a>
    <div class="who"><span class="chip" id="who-role"></span><span class="mail" id="who-mail"></span><button class="btn outline small" type="button" id="logout">Déconnexion</button></div>
  </div><div class="filet"></div></header>
  <div class="mobilebar">
    <span class="mb-lbl"><span class="mb-where">Vous consultez</span><span class="mb-title" id="mb-title">Tableau de bord</span></span>
    <button class="mb-btn" type="button" id="mb-btn" aria-controls="sidebar" aria-expanded="false" onclick="toggleNav()">Menu</button>
  </div>
  <div class="backdrop" id="backdrop" onclick="closeNav()" aria-hidden="true"></div>
  <div class="layout">
    <nav id="sidebar" aria-label="Navigation de l'espace de gestion">
      <div class="drawer-head"><span class="dh-t">Navigation</span><button class="dh-x" type="button" onclick="closeNav()">Fermer</button></div>
      <div class="links" id="nav-links"></div>
    </nav>

/* ==================== Accès aux données ==================== */
function SupabaseAPI(url, key) {
  const sb = window.supabase.createClient(url, key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  const q = async (p) => { const {data, error} = await p; if (error) throw error; return data; };
  return {
    demo: false,
    async session() { const {data} = await sb.auth.getSession(); return data.session ? data.session.user : null; },
    async login(email, pw) { return (await q(sb.auth.signInWithPassword({email, password: pw}))).user; },
    async logout() { await sb.auth.signOut(); },
    async reset(email) { return q(sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split('#')[0]})); },
    async motDePasse(pw) { return q(sb.auth.updateUser({password: pw})); },
    async list(t, o) {
      o = o || {}; let r = sb.from(t).select(o.select || '*');
      Object.entries(o.eq || {}).forEach(([k, v]) => { r = r.eq(k, v); });
      if (o.in) r = r.in(o.in[0], o.in[1]);
      (o.order || []).forEach(([c, asc]) => { r = r.order(c, {ascending: asc !== false}); });
      if (o.limit) r = r.limit(o.limit);
      return q(r);
    },
    async get(t, k) { return q(sb.from(t).select('*').eq(keyOf(t), k).maybeSingle()); },
    async insert(t, row) { return q(sb.from(t).insert(row).select().single()); },
    async update(t, k, patch) { const d = await q(sb.from(t).update(patch).eq(keyOf(t), k).select()); if (!d.length) throw new Error('permission denied'); return d[0]; },
    async upsert(t, row) { return q(sb.from(t).upsert(row).select().single()); },
    async remove(t, k) { const d = await q(sb.from(t).delete().eq(keyOf(t), k).select()); if (!d.length) throw new Error('permission denied'); },
    async rpc(n, a) { return q(sb.rpc(n, a)); },
    async upload(bucket, path, file) {
      await q(sb.storage.from(bucket).upload(path, file, {contentType: file.type, upsert: false}));
      return bucket === 'bat' ? path : sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
    },
    async fichiers(bucket) {
      const d = await q(sb.storage.from(bucket).list('', {limit: 500, sortBy: {column: 'created_at', order: 'desc'}}));
      return d.filter(f => f.id).map(f => ({bucket, nom: f.name, taille: (f.metadata || {}).size || 0, date: f.created_at, url: sb.storage.from(bucket).getPublicUrl(f.name).data.publicUrl}));
    },
    async supprimerFichier(bucket, nom) { return q(sb.storage.from(bucket).remove([nom])); },
    async lienBat(path) { return (await q(sb.storage.from('bat').createSignedUrl(path, 3600))).signedUrl; },
    async fn(nom, corps) {
      const {data, error} = await sb.functions.invoke(nom, {body: corps});
      if (error) { let m = error.message; try { const j = await error.context.json(); m = j.erreur || j.message || m; } catch (e) {} throw new Error(m); }
      if (data && data.erreur) throw new Error(data.erreur);
      return data;
    }
  };
}

function paliersOk(q, p) {
  if (q.length !== p.length || q.length < 2 || q.length > 6 || q[0] < 1) return false;
  for (let i = 1; i < q.length; i++) if (!(q[i] > q[i - 1]) || p[i] > p[i - 1]) return false;
  return p.every(v => v > 0) && q.every(v => Number.isInteger(v));
}

/* Générateur de formulaires : {k, l, t, opts, h, req, min, max, step, ro, ph, w, maxl, long} */
function champ(f, v, idp) {
  const id = `${idp}-${f.k}`, val = v == null ? '' : v;
  const attrs = `id="${id}" data-k="${f.k}"${f.req ? ' required' : ''}${f.ro ? ' readonly' : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''}${f.step ? ` step="${f.step}"` : ''}${f.maxl ? ` maxlength="${f.maxl}"` : ''}`;
  let input;
  if (f.t === 'check') return `<label class="check"><input type="checkbox" ${attrs}${val ? ' checked' : ''}> ${esc(f.l)}</label>`;
  if (f.t === 'textarea') input = `<textarea ${attrs}${f.long ? ' class="long"' : ''}>${esc(val)}</textarea>`;
  else if (f.t === 'select') input = `<select ${attrs}>${f.opts.map(([o, l]) => `<option value="${esc(o)}"${String(o) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else input = `<input type="${f.t || 'text'}" ${f.t === 'number' ? 'inputmode="decimal" ' : ''}${attrs} value="${esc(val)}">`;
  return `<div class="field"${f.w ? ` style="grid-column:span ${f.w}"` : ''}><label for="${id}">${esc(f.l)}</label>${input}${f.h ? `<span class="hint">${esc(f.h)}</span>` : ''}</div>`;
}
const formHtml = (fields, obj, idp) => fields.map(f => champ(f, (obj || {})[f.k], idp)).join('');
function lireForm(fields, idp, base) {
  const o = Object.assign({}, base || {});
  fields.forEach(f => {
    const el = $(`${idp}-${f.k}`); if (!el) return;
    if (f.t === 'check') o[f.k] = el.checked;
    else if (f.t === 'number') o[f.k] = el.value === '' ? null : Number(el.value);
    else if (f.t === 'date') o[f.k] = el.value || null;
    else o[f.k] = el.value.trim();
    if (f.nul && o[f.k] === '') o[f.k] = null;
  });
  return o;
}

const tabs = (id, items, cur) => `<div class="tabs" role="tablist">${items.map(([k, l]) => `<button type="button" role="tab" data-tab="${id}" data-v="${k}" aria-selected="${k === cur}">${esc(l)}</button>`).join('')}</div>`;
function bindTabs(id, fn) { document.querySelectorAll(`[data-tab="${id}"]`).forEach(b => b.onclick = () => fn(b.dataset.v)); }
const stBadge = (cls, label) => `<span class="st ${esc(cls)}">${esc(label)}</span>`;
const prodShape = r => fromDb(r);
function csv(nom, lignes) {
  const s = lignes.map(l => l.map(x => { const v = x == null ? '' : String(x); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + s], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = (window.URL && URL.createObjectURL) ? URL.createObjectURL(blob) : '#'; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  toast('Export ' + nom + ' prêt');
}

async function pTableau() {
  const blocs = [];
  if (can('devis')) {
    const ds = await API.list('suivi_devis', {order: [['cree_le', false]]});
    const bats = await API.list('bats');
    const enAttente = bats.filter(b => b.statut === 'en_attente').length;
    const reste = ds.filter(d => ['valide', 'en_production', 'prete', 'livree'].includes(d.statut)).reduce((s, d) => s + Math.max(0, Number(d.reste)), 0);
    blocs.push(`<div class="grid g4">
      <a class="kpi" data-c="ora" href="#/commandes?s=demande"><b>${ds.filter(d => d.statut === 'demande').length}</b><span>demandes à traiter</span></a>

      <a class="kpi" data-c="cya" href="#/production"><b>${ds.filter(d => ['valide', 'en_production'].includes(d.statut)).length}</b><span>commandes à fabriquer</span></a>
      <a class="kpi" data-c="mag" href="#/paiements"><b>${eur(reste)}</b><span>reste à encaisser</span></a></div>`);
    blocs.push(`<div class="card" style="margin-top:16px"><h2 style="margin-bottom:12px">Dernières demandes</h2>${tableDevis(ds.slice(0, 6))}</div>`);

  if (can('produits')) {
    const ps = (await API.list('produits')).map(prodShape);
    blocs.push(`<div class="grid g3" style="margin-top:16px">

/* ==================== Statistiques et exports ==================== */
let STP = '90';
async function pStatistiques() {
  const [ds, ls, ps] = await Promise.all([API.list('suivi_devis'), API.list('devis_lignes', {select: '*, produits(nom, categorie, techniques)'}), API.list('paiements')]);
  const debut = STP === 'tout' ? 0 : Date.now() - Number(STP) * 864e5;
  const dP = ds.filter(d => new Date(d.cree_le).getTime() >= debut);
  const conf = dP.filter(d => ['valide', 'en_production', 'prete', 'livree'].includes(d.statut));
  const ca = conf.reduce((s, d) => s + Number(d.total_ht), 0);
  const enc = ps.filter(p => new Date(p.date_paiement).getTime() >= debut).reduce((s, p) => s + (p.type === 'remboursement' ? -1 : 1) * Number(p.montant), 0);
  const idsConf = new Set(conf.map(d => d.id));
  const lc = ls.filter(l => idsConf.has(l.devis));
  const grp = (f) => { const m = {}; lc.forEach(l => { const k = f(l); m[k] = (m[k] || 0) + Number(l.total); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const parUnivers = grp(l => (catById[(l.produits || {}).categorie] || {}).nom || (l.produits || {}).categorie || '—');
  const parMachine = grp(l => ((l.produits || {}).techniques || []).map(t => (TECH[t] || {}).nom || t)[0] || '—');
  const parProduit = grp(l => l.ref + ' ' + ((l.produits || {}).nom || '')).slice(0, 10);
  const mois = {}; conf.forEach(d => { const k = d.cree_le.slice(0, 7); mois[k] = (mois[k] || 0) + Number(d.total_ht); });
  const parMois = Object.entries(mois).sort((a, b) => a[0].localeCompare(b[0]));
  const tableBar = (titre, rows, col) => {
    const max = Math.max(1, ...rows.map(r => r[1]));
    return `<div class="card"><h2 style="margin-bottom:10px">${esc(titre)}</h2>${rows.length ? `<div class="wrapt"><table class="tbl"><thead><tr><th>${esc(col)}</th><th class="num">CA HT</th><th class="barcell"><span class="sr">Part relative</span></th></tr></thead><tbody>
      ${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${eur(v)}</td><td class="barcell"><div class="bar" style="width:${Math.round(v / max * 100)}%"></div></td></tr>`).join('')}</tbody></table></div>` : '<p class="hint">Aucune commande confirmée sur la période.</p>'}</div>`;
  };
  return head('Pilotage', 'Statistiques et exports', 'Chiffre d’affaires des commandes confirmées (validées, en production, prêtes ou livrées).')
    + `<div class="tools"><label class="sr" for="st-p">Période</label><select id="st-p">${[['30', '30 derniers jours'], ['90', '90 derniers jours'], ['365', '12 derniers mois'], ['tout', 'Depuis le début']].map(([v, l]) => `<option value="${v}"${STP === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`
    + `<div class="grid g4">
      <div class="kpi" data-c="blu"><b>${dP.length}</b><span>demandes reçues</span></div>
      <div class="kpi" data-c="cya"><b>${eur(ca)}</b><span>CA HT confirmé (${conf.length} commandes)</span></div>
      <div class="kpi" data-c="ora"><b>${eur(enc)}</b><span>encaissé sur la période</span></div>
      <div class="kpi" data-c="mag"><b>${dP.length ? Math.round(conf.length / dP.length * 100) : 0} %</b><span>taux de transformation · panier moyen ${eur(conf.length ? ca / conf.length : 0)}</span></div></div>`
    + `<div class="grid g2" style="margin-top:16px;align-items:start">${tableBar('Par mois', parMois.map(([k, v]) => [new Date(k + '-01T12:00:00').toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'}), v]), 'Mois')}${tableBar('Par univers', parUnivers, 'Univers')}${tableBar('Par machine', parMachine, 'Machine')}${tableBar('10 meilleurs produits', parProduit, 'Produit')}</div>`
    + `<div class="card" style="margin-top:16px"><h2 style="margin-bottom:10px">Exports CSV (Excel, Numbers)</h2><div class="actions">
      <button class="btn outline small" type="button" data-x="devis">Devis et commandes</button><button class="btn outline small" type="button" data-x="lignes">Lignes de commande</button>
      <button class="btn outline small" type="button" data-x="paiements">Paiements</button>${can('clients') ? '<button class="btn outline small" type="button" data-x="clients">Clients</button>' : ''}${can('produits') ? '<button class="btn outline small" type="button" data-x="produits">Produits et tarifs</button>' : ''}</div>
      <p class="hint" style="margin-top:8px">Séparateur point-virgule, encodage UTF-8 : s’ouvre directement dans Excel en français.</p></div>`;
}

      if (x === 'produits') { const ps = (await API.list('produits', {order: [['ordre', true]]})).map(prodShape); csv('produits.csv', [['Réf.', 'Nom', 'Univers', 'Machines', 'Paliers', 'Prix HT', 'En ligne'], ...ps.map(p => [p.ref, p.nom, (catById[p.cat] || {}).nom, p.tech.join(' + '), p.q.join(' / '), p.p.map(n).join(' / '), p.actif !== false ? 'oui' : 'non'])]); }
    } catch (e) { toast(messageErreur(e), true); }
  });
}

    + (tout.length ? `<div class="medias">${tout.map(carte).join('')}</div>` : '<p class="empty card">Aucune image pour l’instant.</p>');

function bindMedias() {
  if ($('md-up')) $('md-up').onchange = async ev => {
    const fs = [...(ev.target.files || [])]; let n = 0;
    for (const f of fs) {
      if (f.size > 5 * 1024 * 1024) { toast(f.name + ' : 5 Mo maximum.', true); continue; }
      const base = slug(f.name.replace(/\.[^.]+$/, '')) || 'image', ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      try { await API.upload('medias', `${base}-${Date.now()}.${ext}`, f); n++; } catch (e) { toast(messageErreur(e), true); }
    }
    if (n) { toast(n + ' image(s) ajoutée(s)'); route(); }
  };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copier(b.dataset.copy, 'Lien copié'));
  document.querySelectorAll('[data-delf]').forEach(b => b.onclick = async () => {
    const [bk, nom] = b.dataset.delf.split('|');
    if (!await demander('Supprimer cette image ?', nom, 'Supprimer', true)) return;
    try { await act(() => API.supprimerFichier(bk, nom), 'Image supprimée'); route(); } catch (e) {}
  });
}
function copier(t, msg) {
  const ok = () => toast(msg || 'Copié');
  const repli = () => { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Copie impossible : sélectionnez le texte manuellement', true); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, repli); else repli();
}

  };

let PRM = '';

  const actifs = Object.fromEntries(ds.filter(d => ['valide', 'en_production', 'prete'].includes(d.statut)).map(d => [d.id, d]));
  const machine = l => ((l.produits || {}).techniques || [])[0] || '—';
  const jobs = ls.filter(l => actifs[l.devis] && (!PRM || ((l.produits || {}).techniques || []).includes(PRM)));
  const batOk = id => bats.some(b => b.devis === id && b.statut === 'valide');
  const M = can('production', 'modifier');
  const carte = l => { const d = actifs[l.devis]; const machines = ((l.produits || {}).techniques || []).map(t => (TECH[t] || {}).nom || t).join(' + ') || '—'; const cat = (catById[(l.produits || {}).categorie] || {}).couleur || 'blu';
    return `<div class="job" data-c="${cat}"><div class="actions" style="justify-content:space-between"><b>${esc(d.numero)}</b>${l.express ? stBadge('correction', 'Express') : ''}</div>
      <span><b>${l.quantite} ×</b> ${esc(l.ref)} ${esc((l.produits || {}).nom || '')}</span>
      <span class="muted">${esc(d.client_societe || d.client_nom || '')} · ${esc(machines)}${l.emplacement ? ' · marquage supplémentaire' : ''}</span>
      ${l.note ? `<span class="muted">« ${esc(l.note)} »</span>` : ''}${l.fichier ? `<span class="muted">Fichier : ${esc(l.fichier)}</span>` : ''}
      <span>${batOk(d.id) ? stBadge('valide', 'BAT validé') : stBadge('correction', 'BAT non validé')} <span class="muted">· reçu le ${dateFr(d.cree_le)}</span></span>
      ${M ? `<div class="actions">${l.statut_prod === 'a_faire' ? `<button class="btn dark small" type="button" data-pst="${l.id}|en_cours">Démarrer</button>` : ''}${l.statut_prod === 'en_cours' ? `<button class="btn primary small" type="button" data-pst="${l.id}|termine">Terminer</button><button class="btn outline small" type="button" data-pst="${l.id}|a_faire">Remettre à faire</button>` : ''}${l.statut_prod === 'termine' ? `<button class="btn outline small" type="button" data-pst="${l.id}|en_cours">Rouvrir</button>` : ''}</div>` : ''}</div>`; };
  const col = (st, titre) => { const js = jobs.filter(l => l.statut_prod === st).sort((a, b) => (b.express - a.express) || (actifs[a.devis].cree_le > actifs[b.devis].cree_le ? 1 : -1));
    return `<section class="col" aria-label="${titre}"><h2>${titre} <span class="st ${st}">${js.length}</span></h2>${js.map(carte).join('') || '<p class="hint">Rien ici.</p>'}</section>`; };

}

/* ==================== Paiements ==================== */
let PAF = {m: '', p: '90'};
async function pPaiements() {
  const [ps, ds] = await Promise.all([API.list('paiements', {order: [['date_paiement', false]]}), can('devis') || can('statistiques') ? API.list('suivi_devis') : Promise.resolve([])]);
  const dv = Object.fromEntries(ds.map(d => [d.id, d]));
  const debut = PAF.p === 'tout' ? '' : new Date(Date.now() - Number(PAF.p) * 864e5).toISOString().slice(0, 10);
  const liste = ps.filter(p => (!PAF.m || p.mode === PAF.m) && (!debut || p.date_paiement >= debut));
  const signe = p => (p.type === 'remboursement' ? -1 : 1) * Number(p.montant);
  const tot = liste.reduce((s, p) => s + signe(p), 0);
  const parMode = Object.entries(MODES).map(([k, v]) => [v, liste.filter(p => p.mode === k).reduce((s, p) => s + signe(p), 0)]).filter(x => x[1]);
  return head('Ventes', 'Paiements', `${liste.length} paiement(s) · ${eur(tot)} encaissés`)
    + `<div class="tools"><label class="sr" for="pa-m">Mode</label><select id="pa-m"><option value="">Tous les modes</option>${Object.entries(MODES).map(([k, v]) => `<option value="${k}"${PAF.m === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      <label class="sr" for="pa-p">Période</label><select id="pa-p">${[['30', '30 derniers jours'], ['90', '90 derniers jours'], ['365', '12 derniers mois'], ['tout', 'Tout']].map(([v, l]) => `<option value="${v}"${PAF.p === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`
    + (parMode.length ? `<div class="grid g4" style="margin-bottom:16px">${parMode.map(([m, v], i) => `<div class="kpi" data-c="${['cya', 'ora', 'blu', 'mag', 'cya'][i]}"><b>${eur(v)}</b><span>${esc(m)}</span></div>`).join('')}</div>` : '')
    + (liste.length ? `<div class="wrapt"><table class="tbl"><thead><tr><th>Date</th><th>Devis</th><th>Client</th><th>Type</th><th>Mode</th><th class="num">Montant</th></tr></thead><tbody>
      ${liste.map(p => { const d = dv[p.devis] || {}; const lien = can('devis'); return `<tr${lien ? ` class="go" tabindex="0" onclick="go('#/commandes/${p.devis}')" onkeydown="if(event.key==='Enter')go('#/commandes/${p.devis}')"` : ''}><td>${dateFr(p.date_paiement)}</td><td><b>${esc(d.numero || '#' + p.devis)}</b></td><td>${esc(d.client_societe || d.client_nom || '—')}</td><td>${TYPES[p.type]}</td><td>${MODES[p.mode]}${p.reference ? `<div class="muted">${esc(p.reference)}</div>` : ''}</td><td class="num">${p.type === 'remboursement' ? '−' : ''}${eur(p.montant)}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="empty card">Aucun paiement sur cette période.</p>');
}
function bindPaiements() { $('pa-m').onchange = e => { PAF.m = e.target.value; route(); }; $('pa-p').onchange = e => { PAF.p = e.target.value; route(); }; }

    if (!c.checked && c.dataset.pa === 'voir') document.querySelectorAll(`[data-pm="${m}"]`).forEach(x => { x.checked = false; });
  });
  if ($('ro-del')) $('ro-del').onclick = async () => { if (!await demander('Supprimer ce rôle ?', '', 'Supprimer', true)) return; try { await act(() => API.remove('roles', RO_EDIT.id), 'Rôle supprimé'); RO_EDIT = null; await chargerRef(); route(); } catch (e) {} };
  if ($('ro-f')) $('ro-f').onsubmit = async ev => {
    ev.preventDefault(); const e = RO_EDIT;
    const o = lireForm([{k: 'nom'}, {k: 'description'}], 'ro');
    if (o.nom.length < 2) { toast('Nom du rôle requis.', true); return; }
    const row = {nom: o.nom, description: o.description};
    if (!e.systeme) {
      const permissions = Object.assign({}, ME.role !== 'admin' ? {} : {}, Object.fromEntries(Object.entries(e.permissions || {}).filter(([m]) => ME.role !== 'admin' && (m === 'roles' || m === 'utilisateurs'))));
      document.querySelectorAll('[data-pm]:checked').forEach(c => { if (c.disabled) return; (permissions[c.dataset.pm] = permissions[c.dataset.pm] || []).push(c.dataset.pa); });
      row.permissions = permissions;
    }
    try {
      let id = e.id;
      if (e._nouveau) { id = slug(o.nom).slice(0, 30) || 'role'; while (ROLES.some(r => r.id === id)) id = id.slice(0, 26) + '-' + Math.floor(Math.random() * 900 + 100); await act(() => API.insert('roles', {id, ...row, ordre: 50}), 'Rôle créé'); }
      else await act(() => API.update('roles', e.id, row), 'Rôle enregistré');
      await chargerRef(); RO_EDIT = JSON.parse(JSON.stringify(ROLES.find(r => r.id === id) || {...row, id})); buildNav(); route();
    } catch (err) {}
  };
}

/* ==================== Journal ==================== */
let JF = {t: '', q: ''};
async function pJournal() {
  const js = await API.list('journal', {order: [['id', false]], limit: 500});
  const tables = [...new Set(js.map(j => j.table_nom))].sort();
  const liste = js.filter(j => (!JF.t || j.table_nom === JF.t) && (!JF.q || norm([j.qui_email, j.cle, JSON.stringify(j.apres)].join(' ')).includes(norm(JF.q))));
  const diff = (a, b) => {
    if (!a && !b) return ''; if (!a) return '<span class="muted">création</span>'; if (!b) return '<span class="muted">suppression</span>';
    const ks = Object.keys(b).filter(k => !['maj_le', 'maj_par', 'total_ttc'].includes(k) && JSON.stringify(a[k]) !== JSON.stringify(b[k]));
    return ks.slice(0, 4).map(k => `<b>${esc(k)}</b> : ${esc(String(JSON.stringify(a[k])).slice(0, 40))} → ${esc(String(JSON.stringify(b[k])).slice(0, 40))}`).join('<br>') || '<span class="muted">sans changement visible</span>';
  };
  const ACT = {insert: 'Création', update: 'Modification', delete: 'Suppression', invitation: 'Invitation', renvoi_invitation: 'Invitation renvoyée', suppression: 'Suppression de compte'};
  return head('Administration', 'Journal des actions', 'Les 500 dernières actions : catalogue, contenus, comptes, rôles, devis, BAT et paiements.')
    + `<div class="tools"><label class="sr" for="jf-t">Élément</label><select id="jf-t"><option value="">Tous les éléments</option>${tables.map(t => `<option${JF.t === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <label class="sr" for="jf-q">Rechercher</label><input id="jf-q" type="search" placeholder="Personne, référence…" value="${esc(JF.q)}"></div>`
    + (liste.length ? `<div class="wrapt"><table class="tbl"><thead><tr><th>Quand</th><th>Qui</th><th>Action</th><th>Élément</th><th>Détail</th></tr></thead><tbody>
      ${liste.map(j => `<tr><td>${heureFr(j.quand)}</td><td>${esc(j.qui_email || 'système')}${j.role ? `<div class="muted">${esc((ROLES.find(r => r.id === j.role) || {}).nom || j.role)}</div>` : ''}</td>
        <td>${ACT[j.action] || esc(j.action)}</td><td><b>${esc(j.table_nom)}</b><div class="muted">${esc(j.cle || '')}</div></td><td class="diff">${diff(j.avant, j.apres)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty card">Aucune action pour ce filtre.</p>');
}
function bindJournal() {
  $('jf-t').onchange = e => { JF.t = e.target.value; route(); };
  $('jf-q').oninput = e => { JF.q = e.target.value; clearTimeout(bindJournal.t); bindJournal.t = setTimeout(async () => { await route(); const i = $('jf-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); };
}

/* ==================== Routeur ==================== */
function parse() {
  const h = location.hash.replace(/^#\/?/, ''); const [path, qs] = h.split('?'); const [a, b] = path.split('/');
  return {a: a || 'tableau', b: b ? decodeURIComponent(b) : '', params: new URLSearchParams(qs || '')};
}
const VUES = {
  tableau: {f: pTableau}, statistiques: {f: pStatistiques, b: bindStatistiques},
  produits: {f: pProduits, b: bindProduits, sub: {f: pProduit, b: bindProduit}}, univers: {f: pUnivers, b: bindUnivers}, machines: {f: pMachines, b: bindMachines},
  promotions: {f: pPromotions, b: bindPromotions}, medias: {f: pMedias, b: bindMedias},
  commandes: {f: pCommandes, b: bindCommandes, sub: {f: pCommande, b: bindCommande}}, production: {f: pProduction, b: bindProduction}, paiements: {f: pPaiements, b: bindPaiements}, clients: {f: pClients, b: bindClients},
  pages: {f: pPages, b: bindPages}, textes: {f: pTextes, b: bindTextes},
  utilisateurs: {f: pUtilisateurs, b: bindUtilisateurs}, roles: {f: pRoles, b: bindRoles}, parametres: {f: pParametres, b: bindParametres}, emails: {f: pEmails, b: bindEmails}, journal: {f: pJournal, b: bindJournal}
};
let routeSeq = 0;
async function route() {
  if (!ME) return;
  const seq = ++routeSeq, r = parse();
  let def = PAGES.find(p => p.page === r.a && visible(p));
  if (!def) { def = PAGES.find(p => p.page === 'tableau'); if (location.hash !== '#/tableau') { try { history.replaceState(null, '', '#/tableau'); } catch (e) {} } r.b = ''; }
  const v = VUES[def.page], sub = r.b && v.sub;
  setActive(def.page, sub ? (def.page === 'produits' ? (r.b === 'nouveau' ? 'Nouveau produit' : 'Produit ' + r.b) : 'Devis') : def.label);
  closeNav();
  try {
    const html = sub ? await v.sub.f(r.b) : await v.f(r.params);
    if (seq !== routeSeq) return;
    $('main').innerHTML = html;
    const binder = sub ? v.sub.b : v.b; if (binder) await binder(r.params);
  } catch (e) {
    if (seq !== routeSeq) return;
    $('main').innerHTML = `<div class="card"><p class="msg err">${esc(messageErreur(e))}</p><p class="hint" style="margin-top:8px"><a href="#/tableau">Retour au tableau de bord</a></p></div>`;
  }
  adapterTables();
  try { window.scrollTo(0, 0); } catch (e) {}
}
function adapterTables() {
  document.querySelectorAll('#main .wrapt').forEach(w => {
    const t = w.querySelector('table'); if (!t) return;
    if (!w.dataset.lab) {
      const heads = [...t.querySelectorAll('thead tr > *')].map(h => h.textContent.trim());
      t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((c, i) => { if (heads[i] && !c.hasAttribute('colspan')) c.setAttribute('data-l', heads[i]); }));
      w.dataset.lab = '1';
    }
    w.classList.remove('stack');
    if (t.scrollWidth > w.clientWidth + 1) w.classList.add('stack');
  });
}
let adaptT = null;
window.addEventListener('resize', () => { clearTimeout(adaptT); adaptT = setTimeout(adapterTables, 120); });

async function chargerRef() {
  try {
    const [cs, ts, ps, rs] = await Promise.all([API.list('categories', {order: [['ordre', true]]}), API.list('techniques', {order: [['ordre', true]]}), API.list('parametres'), API.list('roles', {order: [['ordre', true]]})]);
    if (cs.length) { CATS = cs; catById = Object.fromEntries(CATS.map(c => [c.id, c])); }
    if (ts.length) TECH = Object.fromEntries(ts.map(t => [t.id, {nom: t.nom, detail: t.detail, delai: t.delai_jours}]));
    PARAMS = Object.fromEntries(ps.map(p => [p.cle, p.valeur]));
    CFG = Object.assign({}, CFG, PARAMS);
    if (rs.length) ROLES = rs;
  } catch (e) {}
}
async function compterBadges() {
  BADGES = {};
  try { if (can('devis')) BADGES.aTraiter = (await API.list('devis', {eq: {statut: 'demande'}})).length; } catch (e) {}
  try {
    if (can('production')) {
      const [ds, ls] = await Promise.all([API.list('devis'), API.list('devis_lignes')]);
      const ok = new Set(ds.filter(d => ['valide', 'en_production'].includes(d.statut)).map(d => d.id));
      BADGES.aProduire = ls.filter(l => ok.has(l.devis) && l.statut_prod !== 'termine').length;
    }
  } catch (e) {}
  try { if (can('emails')) BADGES.mails = (await API.list('emails', {eq: {statut: 'en_attente'}})).length; } catch (e) {}
}

/* ==================== Connexion ==================== */
function vueLogin(msg) {
  $('app-view').hidden = true; $('login-view').hidden = false;
  $('login-view').innerHTML = `<div class="box">
    <img src="${esc(CFG.logo)}" alt="Logo LAZR DECO">
    <h1>Espace de gestion</h1>
    ${API.demo ? `<div class="demo"><p><b style="color:var(--on-dark)">Mode démonstration.</b> Supabase n’est pas encore configuré : choisissez un profil pour explorer l’espace avec des données d’exemple. Rien n’est enregistré.</p>
      ${msg ? `<p role="alert" style="color:var(--mag-f);font-weight:700">${esc(msg)}</p>` : ''}
      <div class="row"><button class="btn primary" type="button" data-demo="admin">Administrateur</button><button class="btn light" type="button" data-demo="createur">Créateur</button><button class="btn outline" type="button" data-demo="gestion">Gestion</button><button class="btn outline" type="button" data-demo="atelier">Atelier</button></div></div>`
    : `<form class="card" id="lform" novalidate>
      <div class="field"><label for="l-mail">E-mail</label><input id="l-mail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pw">Mot de passe</label><input id="l-pw" type="password" autocomplete="current-password" required></div>
      <p class="msg err" id="l-err" role="alert">${esc(msg || '')}</p>
      <button class="btn primary" type="submit">Se connecter</button>
      <button class="btn outline small" type="button" id="l-reset">Mot de passe oublié</button></form>`}
    <p class="note">Accès réservé à l’équipe LAZR DECO. Les clients se connectent depuis le site.</p></div>`;
  document.querySelectorAll('[data-demo]').forEach(b => b.onclick = async () => { const u = await API.loginDemo(b.dataset.demo); await demarrer(u); });
  if ($('lform')) {
    $('lform').onsubmit = async ev => {
      ev.preventDefault(); $('l-err').textContent = '';
      try { const u = await API.login($('l-mail').value.trim(), $('l-pw').value); await demarrer(u); } catch (e) { $('l-err').textContent = messageErreur(e); }
    };
    $('l-reset').onclick = async () => {
      const m = $('l-mail').value.trim(); if (!m) { $('l-err').textContent = 'Saisissez votre e-mail puis cliquez à nouveau.'; $('l-mail').focus(); return; }
      try { await API.reset(m); toast('E-mail de réinitialisation envoyé'); } catch (e) { $('l-err').textContent = messageErreur(e); }
    };
  }
}
function vueMotDePasse(user, invite) {
  $('app-view').hidden = true; $('login-view').hidden = false;
  $('login-view').innerHTML = `<div class="box"><img src="${esc(CFG.logo)}" alt="Logo LAZR DECO"><h1>${invite ? 'Bienvenue dans l’équipe' : 'Nouveau mot de passe'}</h1>
    <form class="card" id="pwform" novalidate><p>${invite ? 'Choisissez votre mot de passe pour activer votre compte' : 'Choisissez un nouveau mot de passe pour'} <b>${esc(user.email)}</b>.</p>
      <div class="field"><label for="pw1">Mot de passe (8 caractères minimum)</label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="pw2">Confirmation</label><input id="pw2" type="password" autocomplete="new-password" required></div>
      <p class="msg err" id="pw-err" role="alert"></p><button class="btn primary" type="submit">Enregistrer et continuer</button></form></div>`;
  $('pwform').onsubmit = async ev => {
    ev.preventDefault(); const a = $('pw1').value, b = $('pw2').value;
    if (a.length < 8) { $('pw-err').textContent = 'Mot de passe trop court : 8 caractères minimum.'; return; }
    if (a !== b) { $('pw-err').textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
    try { await API.motDePasse(a); toast('Mot de passe enregistré'); try { history.replaceState(null, '', '#/tableau'); } catch (e) {} await demarrer(user); } catch (e) { $('pw-err').textContent = messageErreur(e); }
  };
}
async function demarrer(user) {
  if (!user) return vueLogin();
  let p = null;
  try { await chargerRef(); p = await API.get('profils', user.id); } catch (e) {}
  const r = p && ROLES.find(x => x.id === p.role);
  if (!p || !p.actif || !r || !r.equipe) { await API.logout(); ME = null; return vueLogin(!p ? 'Profil introuvable.' : !p.actif ? 'Ce compte est désactivé.' : 'Ce compte n’a pas accès à l’espace de gestion.'); }
  ME = p;
  $('login-view').hidden = true; $('app-view').hidden = false; $('demo-band').hidden = !API.demo;
  $('who-role').textContent = r.nom; $('who-role').className = 'chip' + (p.role === 'admin' ? ' r-admin' : ''); $('who-mail').textContent = p.email;
  RO_EDIT = null; PROMO_EDIT = null; PG_EDIT = null;
  await compterBadges(); buildNav();
  if (!location.hash || location.hash === '#' || /access_token|type=/.test(location.hash)) { try { history.replaceState(null, '', '#/tableau'); } catch (e) {} }
  await route();
}
$('logout').onclick = async () => { await API.logout(); ME = null; vueLogin(); };

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('modal').hidden) fermerModal(false); else closeNav(); } });
if (typeof window.matchMedia === 'function') {
  const wide = window.matchMedia('(min-width: 901px)'); const onWide = e => { if (e.matches) closeNav(); };
  if (wide.addEventListener) wide.addEventListener('change', onWide); else if (wide.addListener) wide.addListener(onWide);
} else { window.addEventListener('resize', () => { if (window.innerWidth > 900) closeNav(); }); }
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => { if (x0 === null || !$('sidebar').classList.contains('open')) { x0 = null; return; } if (e.changedTouches[0].clientX - x0 < -55) closeNav(); x0 = null; }, {passive: true});
window.addEventListener('hashchange', () => { if (!/access_token|type=/.test(location.hash)) route(); });

chargerLogo(() => {});
(async () => {
  try {
    const u = await API.session();
    if (u && RETOUR_AUTH && ['invite', 'recovery'].includes(RETOUR_AUTH[1])) return vueMotDePasse(u, RETOUR_AUTH[1] === 'invite');
    await demarrer(u);
  } catch (e) { vueLogin(); }
})();
</script>
