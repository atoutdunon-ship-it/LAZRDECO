<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAZR DECO — Marquage publicitaire et impression personnalisée</title>
<meta name="description" content="Objets publicitaires, textile, signalétique, cadeaux gravés et impression alimentaire, fabriqués en Martinique. Livraison Martinique, Guadeloupe, Guyane.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --white:#FFFFFF;--cream:#FFF9F3;--sand:#F4EEE7;--line:#E6DED4;
  --ink:#101826;--ink-2:#1C2638;--edge:#2E3A50;
  --body:#2A3441;--gray:#4F5B6B;--ph:#4A5568;
  --on-dark:#FFFFFF;--on-dark-2:#E4E9F1;--on-dark-3:#C3CEDD;
  --accent:#0B4F80;--err:#A3123F;--ok:#08555F;
  --mag:#E8175D;--mag-d:#FF8DB4;--mag-l:#A3123F;--mag-f:#FF7AA2;--mag-t:#FFE6EF;
  --cya:#12A8B8;--cya-d:#6EDDEA;--cya-l:#08555F;--cya-f:#3FD0DC;--cya-t:#DDF6F8;
  --ora:#F7A21B;--ora-d:#FFB65C;--ora-l:#7F3D00;--ora-f:#FFB23E;--ora-t:#FFF0D9;
  --blu:#1477B8;--blu-d:#8CCBF5;--blu-l:#0B4F80;--blu-f:#6BB8EC;--blu-t:#E1EFFA;
  --grad:linear-gradient(90deg,#F7A21B,#E8175D,#12A8B8,#1477B8);
  --r:999px;--rad:22px;--rad-s:14px;--wrap:1280px;
  --display:'Fraunces',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
  --shadow:0 18px 40px -18px rgba(16,24,38,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden}
a{color:var(--accent)}a:hover{color:var(--ink)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);color:var(--ink);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em;font-optical-sizing:auto}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px}
.eyebrow{display:inline-block;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--accent)}
:focus-visible{outline:3px solid var(--blu);outline-offset:3px}
[data-c=mag]{--c:var(--mag);--c-d:var(--mag-d);--c-l:var(--mag-l);--c-f:var(--mag-f);--c-t:var(--mag-t)}
[data-c=cya]{--c:var(--cya);--c-d:var(--cya-d);--c-l:var(--cya-l);--c-f:var(--cya-f);--c-t:var(--cya-t)}
[data-c=ora]{--c:var(--ora);--c-d:var(--ora-d);--c-l:var(--ora-l);--c-f:var(--ora-f);--c-t:var(--ora-t)}
[data-c=blu]{--c:var(--blu);--c-d:var(--blu-d);--c-l:var(--blu-l);--c-f:var(--blu-f);--c-t:var(--blu-t)}
.t-mag{color:var(--mag-d)}.t-cya{color:var(--cya-d)}.t-ora{color:var(--ora-d)}.t-blu{color:var(--blu-d)}
em{font-style:italic}

/* Bandeau promo */
.promo{background:var(--ink);color:var(--on-dark-2);font-size:.82rem;font-weight:500}
.promo .wrap{display:flex;justify-content:center;gap:28px;min-height:36px;align-items:center;flex-wrap:wrap}
.promo span{display:inline-flex;align-items:center;gap:10px}
.promo span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}

/* En-tête */
header.top{background:#FAF9F7;position:sticky;top:0;z-index:300;box-shadow:0 1px 0 var(--line)}
header.top .wrap{display:flex;align-items:center;gap:28px;height:116px}
.brand{text-decoration:none;display:flex;align-items:center;min-width:0;flex-shrink:0}
.brand img{display:block;height:104px;width:auto}
.brand b{font-family:var(--display);font-weight:900;font-size:1.65rem;color:var(--ink);letter-spacing:.01em;white-space:nowrap;line-height:1}
.brand b i{font-style:italic;color:var(--mag-l)}
.brand span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);margin-top:4px}
.search{flex:1;display:flex;max-width:500px;margin-left:auto;background:var(--sand);border-radius:var(--r);padding:4px;border:2px solid transparent;transition:border-color .2s}
.search:focus-within{border-color:var(--ink);background:var(--white)}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;padding:0 18px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search button{height:44px;padding:0 22px;border:0;background:var(--ink);color:var(--on-dark);font:inherit;font-weight:700;border-radius:var(--r);cursor:pointer}
.quote-link{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 8px 0 20px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap;background:var(--ora-f);transition:transform .15s}
.quote-link:hover{color:var(--ink);transform:translateY(-2px)}
.quote-link .n{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:var(--r);background:var(--ink);color:var(--on-dark);font-size:.85rem}
.filet{height:6px;background:var(--grad)}
.acct-link{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap;border:2px solid var(--ink)}
.acct-link:hover{background:var(--ink);color:var(--on-dark)}
.acct-link.on{background:var(--cya-f);border-color:var(--cya-f)}
.st{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:var(--r);font-size:.8rem;font-weight:700;color:var(--ink);background:var(--sand);white-space:nowrap}
.st.demande{background:var(--ora-f)}.st.devis_envoye,.st.bat_envoye{background:var(--blu-t)}.st.valide{background:var(--cya-t)}.st.en_production{background:var(--cya-f)}.st.prete{background:var(--blu-f)}.st.livree{background:#BFE8D6}.st.annulee{color:var(--gray)}
.acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.acc .box{background:var(--cream);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:14px}
.acc .box h2{font-size:1.5rem}
.order{background:var(--white);border-radius:var(--rad);box-shadow:0 0 0 1px var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.order .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.order .top b{font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.order ul{margin:0;padding-left:18px;font-size:.9rem}
.order .sums{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem}
.order .sums b{color:var(--ink)}
.order .bat{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.order .bat textarea{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:var(--rad-s);padding:8px 12px;min-height:80px;width:100%;color:var(--ink)}
.annonce{display:block;text-align:center;padding:10px 16px;font-weight:700;color:var(--ink);background:var(--c-f,var(--ora-f));text-decoration:none}
a.annonce:hover{text-decoration:underline;color:var(--ink)}
.price s,.tiers s{color:var(--gray);font-weight:500;font-size:.85em}
.badge.promo{left:auto;right:14px;background:var(--ink)}
.code-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.page-md{max-width:780px;padding-bottom:40px}
.page-md h2{font-size:1.5rem;margin:26px 0 10px}.page-md h3{font-size:1.15rem;margin:18px 0 8px}
.page-md p{margin:0 0 12px}.page-md ul{margin:0 0 12px;padding-left:22px}
.page-md .md-note{background:var(--ora-t);border-radius:var(--rad-s);padding:12px 16px;color:var(--ink)}
.modal[hidden]{display:none!important}
.prod>*,.qlayout>*,.cat-layout>*,.qline>*,.hero .wrap>*{min-width:0}
.tiers-m{display:none;list-style:none;margin:0;padding:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tiers-m li{background:var(--cream);border-radius:var(--rad-s);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tiers-m li span{font-size:.8rem;color:var(--gray);font-weight:600}
.tiers-m li b{font-family:var(--display);font-size:1.1rem;color:var(--ink)}
.tiers-m li.on{background:var(--c-l)}.tiers-m li.on span,.tiers-m li.on b,.tiers-m li.on s{color:var(--on-dark)}
.tiers-cap{display:none;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gray);margin:0 0 10px}
@media(min-width:901px) and (max-width:1240px){body nav#sidebar .links{flex-wrap:wrap;justify-content:center;overflow:visible;row-gap:2px}}
@media(max-width:600px){
  table.tiers{display:none}.tiers-m{display:grid}.tiers-cap{display:block}
  table.ship,table.ship tbody,table.ship tr,table.ship td{display:block;width:100%}
  table.ship thead{display:none}
  table.ship{box-shadow:none;border-radius:0;overflow:visible}
  table.ship tr{background:var(--white);border-radius:var(--rad-s);box-shadow:0 0 0 1px var(--line);margin-bottom:10px;overflow:hidden}
  table.ship td{display:flex;justify-content:space-between;gap:12px;text-align:right;padding:10px 14px}
  table.ship td:first-child{display:block;text-align:left;background:var(--ink);color:var(--on-dark)}
  table.ship td[data-l]::before{content:attr(data-l);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:700;text-align:left;flex-shrink:0}
}
@media(max-width:520px){
  .qline{grid-template-columns:1fr;padding:16px 16px 16px 24px}
  .qline .lt{text-align:left}
  .acc .box{padding:20px 16px}
}
.modal{position:fixed;inset:0;z-index:600;background:rgba(5,13,27,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .mbox{background:var(--white);border-radius:24px;padding:24px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px}

/* Navigation */
nav#sidebar{background:var(--white);border-bottom:1px solid var(--line)}
nav#sidebar .links{max-width:var(--wrap);margin:0 auto;padding:10px 20px;display:flex;flex-wrap:nowrap;gap:2px;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
nav#sidebar .links::-webkit-scrollbar{display:none}
nav#sidebar a{display:flex;align-items:center;min-height:44px;padding:0 9px;color:var(--ink);text-decoration:none;font-size:.83rem;white-space:nowrap;font-weight:600;border-radius:var(--r);cursor:pointer;transition:background .15s}
nav#sidebar a:hover{background:var(--c-t,var(--sand))}
nav#sidebar a.active{background:var(--c-f,var(--ink));color:var(--ink)}
nav#sidebar a.active:not([data-c]){background:var(--ink);color:var(--on-dark)}
nav#sidebar .m-only,.m-search{display:none}
.mobilebar,.drawer-head{display:none}
.backdrop{position:fixed;inset:0;background:rgba(5,13,27,.55);z-index:350;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.backdrop.on{opacity:1;visibility:visible}

main{min-height:60vh}
.crumbs{padding:24px 0 0;font-size:.86rem;color:var(--gray)}
.crumbs a{color:var(--accent);font-weight:600}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 28px;border-radius:var(--r);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.primary{background:var(--mag-l);color:var(--on-dark)}
.btn.primary:hover{color:var(--on-dark)}
.btn.light{background:var(--ora-f);color:var(--ink)}
.btn.light:hover{color:var(--ink)}
.btn.ghost{background:transparent;color:var(--on-dark);border-color:var(--on-dark-3)}
.btn.ghost:hover{border-color:var(--on-dark);color:var(--on-dark)}
.btn.outline{background:var(--white);color:var(--ink);border-color:var(--ink)}
.btn.outline:hover{background:var(--ink);color:var(--on-dark)}
.btn[disabled]{background:var(--sand);color:var(--gray);border-color:var(--line);cursor:not-allowed;transform:none;box-shadow:none}

/* Accueil — hero */
.hero{background:#020200;color:var(--on-dark);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--grad)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:48px;padding-top:80px;padding-bottom:88px;align-items:center}
.hero .eyebrow{color:var(--ora-d)}
.hero h1{color:var(--on-dark);font-size:4.4rem;font-weight:900;margin:18px 0 22px;line-height:.98}
.hero h1 em{font-weight:700}
.hero p.lead{color:var(--on-dark-2);font-size:1.12rem;max-width:540px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:28px;margin-top:44px}
.facts b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--on-dark);line-height:1.1}
.facts span{font-size:.8rem;color:var(--on-dark-3)}
.hero-logo{display:flex;justify-content:center;align-items:center}
.hero-logo img{width:100%;max-width:500px;height:auto;image-rendering:auto}
.collage{position:relative;height:460px}
.ring{position:absolute;border-radius:50%;background:conic-gradient(from 200deg,#F7A21B,#E8175D,#12A8B8,#1477B8,#F7A21B);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 16px),#000 calc(100% - 15px));mask:radial-gradient(farthest-side,transparent calc(100% - 16px),#000 calc(100% - 15px))}
.ring.r1{width:360px;height:360px;right:30px;top:40px;animation:spin 40s linear infinite}
.ring.r2{width:150px;height:150px;left:10px;bottom:10px;animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.stk{position:absolute;width:210px;padding:20px 22px;border-radius:var(--rad);background:var(--c-f);color:var(--ink);box-shadow:var(--shadow);transition:transform .3s}
.stk b{display:block;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1.1}
.stk small{display:block;margin-top:6px;font-size:.82rem;font-weight:600}
.stk.s1{top:20px;left:40px;transform:rotate(-6deg)}
.stk.s2{top:120px;right:10px;transform:rotate(5deg)}
.stk.s3{bottom:70px;left:90px;transform:rotate(4deg)}
.stk.s4{bottom:10px;right:60px;transform:rotate(-4deg)}
.collage:hover .stk{transform:rotate(0) scale(1.03)}

/* Bandeau réassurance */
.assur{padding:28px 0 0}
.assur .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.assur div{padding:18px 20px;border-radius:var(--rad-s);background:var(--c-t)}
.assur b{display:block;color:var(--ink);font-size:.98rem}
.assur span{font-size:.86rem;color:var(--body)}

section.block{padding:72px 0 0}
section.band{margin-top:72px;padding:64px 0;background:var(--c-t)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.sec-head h2{font-size:2.6rem;margin-top:8px}
.sec-head h2 em{color:var(--mag-l);font-weight:700}

/* Univers */
.univers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.uni{position:relative;overflow:hidden;background:var(--c-f);border-radius:var(--rad);padding:26px 24px 22px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-height:230px;color:var(--ink);transition:transform .2s,box-shadow .2s}
.uni > *{position:relative;z-index:1}
.uni::after{content:"";position:absolute;width:130px;height:130px;right:-56px;bottom:-62px;border-radius:50%;border:16px solid rgba(255,255,255,.45)}
.uni:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:var(--shadow);color:var(--ink)}
.uni .num{font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:1;color:var(--ink)}
.uni h3{font-size:1.35rem}
.uni p{font-size:.92rem;color:var(--ink);max-width:90%}
.uni .meta{margin-top:auto;align-self:flex-start;position:relative;z-index:1;font-size:.84rem;font-weight:700;background:var(--white);color:var(--ink);padding:7px 14px;border-radius:var(--r)}

/* Technologies */
.techs-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.techs-row a{position:relative;overflow:hidden;padding:26px 22px;border-radius:var(--rad);background:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:220px;transition:transform .2s}
.techs-row a::before{content:"";position:absolute;width:120px;height:120px;right:-30px;top:-30px;border-radius:50%;background:var(--c)}
.techs-row a:hover{transform:translateY(-6px)}
.techs-row b{position:relative;font-family:var(--display);font-weight:800;color:var(--on-dark);font-size:1.3rem;margin-top:52px}
.techs-row span{font-size:.88rem;color:var(--on-dark-2)}
.techs-row em{font-style:normal;font-size:.84rem;color:var(--c-d);font-weight:700;margin-top:auto}

/* Bannière d'appel */
.cta-band{margin-top:72px}
.cta-band .inner{position:relative;overflow:hidden;border-radius:28px;background:var(--mag-l);color:var(--on-dark);padding:48px 56px;display:grid;grid-template-columns:1.4fr auto;gap:28px;align-items:center}
.cta-band .inner::after{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-120px;border-radius:50%;border:28px solid rgba(255,255,255,.18)}
.cta-band h2{color:var(--on-dark);font-size:2.3rem}
.cta-band p{color:var(--on-dark);margin-top:10px;max-width:560px}
.cta-band .btn{position:relative;z-index:1;background:var(--white);color:var(--ink)}

/* Catalogue */
.cat-head{position:relative;overflow:hidden;margin:18px 0 32px;padding:40px 44px;border-radius:28px;background:var(--c-t,var(--sand))}
.cat-head::after{content:"";position:absolute;width:260px;height:260px;right:-70px;top:-90px;border-radius:50%;background:var(--c-f,var(--ora-f))}
.cat-head > *{position:relative;z-index:1}
.cat-head .eyebrow{color:var(--ink)}
.cat-head h1{font-size:3rem;margin:10px 0 12px;max-width:760px}
.cat-head p{max-width:680px;color:var(--body)}
.cat-head .bar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:var(--r);background:var(--c-f,var(--white));color:var(--ink);text-decoration:none;font-size:.88rem;font-weight:600;transition:transform .15s}
.chip:hover{transform:translateY(-2px);color:var(--ink)}
.cat-layout{display:grid;grid-template-columns:270px 1fr;gap:36px;align-items:start}
.fbox{background:var(--cream);border-radius:var(--rad);padding:4px 22px 8px;position:sticky;top:180px}
.fbox summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--ink)}
.fbox summary::-webkit-details-marker{display:none}
.fbox summary::after{content:"Afficher";font-family:var(--sans);font-size:.8rem;color:var(--accent);font-weight:600}
.fbox[open] summary::after{content:"Masquer"}
.fgroup{padding:16px 0;border-top:1px solid var(--line)}
.fgroup h3{font-family:var(--sans);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);margin-bottom:10px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:.93rem;color:var(--body);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--mag-l);flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;font-weight:700;color:var(--ink)}
.field input,.field select,.field textarea,.results-bar select{font:inherit;font-size:16px;color:var(--ink);background:var(--white);border:2px solid var(--line);border-radius:var(--rad-s);padding:10px 14px;min-height:46px}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.hint{font-size:.84rem;color:var(--gray)}

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/*TARIFS*/

/* --- Prix --- */
function tierIndex(p, q) { let i = -1; p.q.forEach((t, k) => { if (q >= t) i = k; }); return i; }
/* Prix affiché = palier → promotion en cours → tarif pro du compte (mêmes règles que la base). */
const remisePro = () => Number((MOI && MOI.remise_pro) || 0);
const promoDe = p => TARIF.promoPct(p, PROMOS);
function prixAff(v, p) { const pc = promoDe(p), rp = remisePro(); return r2(v * (1 - pc / 100) * (1 - rp / 100)); }
function unitPrice(p, q) { const i = tierIndex(p, q); return i < 0 ? null : prixAff(p.p[i], p); }
function lineCalc(l) {
  const p = byRef[l.ref]; if (!p) return null;
  const q = Math.floor(Number(l.qty)) || 0;
  const r = TARIF.unitaire(p, q, {promos: PROMOS, emplacement: l.empl, express: l.express, tauxExpress: CFG.express, remisePro: remisePro()});
  if (!r) return {p, q, u: null, total: null, min: p.q[0]};
  return {p, q, u: r.u, total: r2(r.u * q), min: p.q[0], base: prixAff(p.p[0], p), pct: r.pct};
}
const prixBarre = (p, v) => { const a = prixAff(v, p); return a < v ? `<s>${eur(v)}</s> ${eur(a)}` : eur(v); };

const F = {tech: new Set(), budget: '', qty: '', sort: 'pert'};
let scope = {cat: 'tous', q: ''};
function scoped() {
  let list = PRODS;
  if (scope.cat !== 'tous') list = list.filter(p => p.cat === scope.cat);
  if (scope.q) {
    const words = norm(scope.q).split(/\s+/).filter(Boolean);
    list = list.filter(p => { const hay = norm([p.nom, p.desc, p.ref, catById[p.cat].nom, techNames(p)].join(' ')); return words.every(w => hay.includes(w)); });
  }
  return list;
}
function filtered() {
  const qty = parseInt(F.qty, 10) || 0;
  let list = scoped().filter(p => (!F.tech.size || p.tech.some(t => F.tech.has(t))) && (!qty || p.q[0] <= qty));
  if (F.budget) { const b = Number(F.budget); list = list.filter(p => (qty ? unitPrice(p, qty) : p.p[p.p.length - 1]) <= b); }
  const pr = p => qty ? unitPrice(p, qty) : p.p[p.p.length - 1];
  if (F.sort === 'asc') list = list.slice().sort((a, b) => pr(a) - pr(b));
  else if (F.sort === 'desc') list = list.slice().sort((a, b) => pr(b) - pr(a));
  else if (F.sort === 'nom') list = list.slice().sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  return {list, qty};
}

  const box = $('mes-devis');
  const r = await SB.from('suivi_devis').select('*').eq('client', MOI.id).order('cree_le', {ascending: false});
  if (r.error) { box.innerHTML = `<p class="msg" style="color:var(--err)">${esc(msgErreur(r.error))}</p>`; return; }
  if (!r.data.length) { box.innerHTML = '<div class="empty"><p>Aucune demande pour l\u2019instant.</p><a class="btn primary" href="#/c/tous">Parcourir le catalogue</a></div>'; return; }
  const ids = r.data.map(d => d.id);
  const l = await SB.from('devis_lignes').select('devis, ref, quantite, prix_unitaire, total, produits(nom)').in('devis', ids);
  const parDevis = {}; (l.data || []).forEach(x => (parDevis[x.devis] = parDevis[x.devis] || []).push(x));
  const bq = await SB.from('bats').select('*').in('devis', ids).order('version', {ascending: false});
  const batDe = {}; (bq.data || []).forEach(b => { if (!batDe[b.devis]) batDe[b.devis] = b; });
  const BATS = {en_attente: 'À valider', valide: 'Validé', correction: 'Correction demandée', remplace: 'Remplacé'};
  const batHtml = d => { const b = batDe[d.id]; if (!b) return '';
    return `<div class="bat"><p><b>Bon à tirer v${b.version}</b> · <span class="st ${b.statut === 'en_attente' ? 'bat_envoye' : b.statut === 'valide' ? 'valide' : 'demande'}">${BATS[b.statut]}</span></p>
      ${b.message ? `<p class="hint">« ${esc(b.message)} »</p>` : ''}${b.commentaire_client ? `<p class="hint">Votre demande : « ${esc(b.commentaire_client)} »</p>` : ''}
      <div class="chips"><button class="btn outline" type="button" data-voirbat="${esc(b.fichier)}">Voir le BAT</button></div>
      ${b.statut === 'en_attente' ? `<div class="field"><label for="bc-${b.id}">Correction souhaitée (si besoin)</label><textarea id="bc-${b.id}" maxlength="1000"></textarea></div>
      <div class="stack nav-btns"><button class="btn primary" type="button" data-batok="${b.id}">Valider le BAT et lancer la fabrication</button><button class="btn outline" type="button" data-batko="${b.id}">Demander une correction</button></div>` : ''}</div>`; };
  box.innerHTML = r.data.map(d => `<article class="order">
    <div class="top"><b>${esc(d.numero)}</b><span class="st ${esc(d.statut)}">${STATUTS[d.statut] || esc(d.statut)}</span></div>
    <p class="hint">${new Date(d.cree_le).toLocaleDateString('fr-FR')} · ${esc((DEST.find(x => x.id === d.destination) || {}).nom || d.destination)}</p>
    <ul>${(parDevis[d.id] || []).map(x => `<li>${esc(x.produits ? x.produits.nom : x.ref)} × ${x.quantite} — ${eur(Number(x.total))} HT</li>`).join('')}</ul>
    <div class="sums"><span>Total TTC <b>${eur(Number(d.total_ttc))}</b></span><span>Payé <b>${eur(Number(d.paye))}</b></span>${d.statut !== 'annulee' && Number(d.reste) > 0.004 ? `<span>Reste <b>${eur(Number(d.reste))}</b></span>` : ''}</div>
    ${d.code_promo ? `<p class="hint">Code ${esc(d.code_promo)} : ${d.code_valide ? '−' + eur(Number(d.remise_code)) + ' HT' : 'non applicable'}</p>` : ''}
    ${batHtml(d)}
    ${d.statut === 'demande' ? `<div><button class="btn outline" type="button" data-annuler="${d.id}">Annuler cette demande</button></div>` : ''}</article>`).join('');
  document.querySelectorAll('[data-voirbat]').forEach(b => b.onclick = async () => {
    const x = await SB.storage.from('bat').createSignedUrl(b.dataset.voirbat, 3600);
    if (x.error) { toast(msgErreur(x.error)); return; }
    const a = document.createElement('a'); a.href = x.data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  });
  const repondre = async (id, decision) => {
    const com = ($('bc-' + id) || {}).value || '';
    if (decision === 'correction' && com.trim().length < 3) { toast('Décrivez la correction souhaitée.'); $('bc-' + id).focus(); return; }
    if (decision === 'valide' && !await demander('Valider ce BAT ?', 'La fabrication sera lancée à l’identique de ce bon à tirer.', 'Valider')) return;
    const x = await SB.rpc('repondre_bat', {p_bat: Number(id), p_decision: decision, p_commentaire: com.trim() || null});
    if (x.error) toast(msgErreur(x.error)); else { toast(decision === 'valide' ? 'BAT validé : merci !' : 'Demande de correction envoyée'); route(); }
  };
  document.querySelectorAll('[data-batok]').forEach(b => b.onclick = () => repondre(b.dataset.batok, 'valide'));
  document.querySelectorAll('[data-batko]').forEach(b => b.onclick = () => repondre(b.dataset.batko, 'correction'));
  document.querySelectorAll('[data-annuler]').forEach(b => b.onclick = async () => {
    if (!await demander('Annuler cette demande ?', 'Elle restera visible dans votre historique.', 'Annuler la demande', true)) return;
    const x = await SB.from('devis').update({statut: 'annulee'}).eq('id', Number(b.dataset.annuler));
    if (x.error) toast(msgErreur(x.error)); else { toast('Demande annulée'); route(); }
  });
}

/* --- Données en ligne --- */
const depuisDb = p => ({ref: p.ref, nom: p.nom, cat: p.categorie, tech: p.techniques, desc: p.description, q: p.quantites.map(Number), p: p.prix.map(Number),
  badge: p.badge || undefined, emplacement: p.emplacement == null ? undefined : Number(p.emplacement), aPartir: p.a_partir, img: p.image || undefined, forme: p.forme || undefined, teinte: p.teinte || undefined});
function appliquerTextes() { document.querySelectorAll('[data-t]').forEach(el => { const v = T(el.dataset.t); if (v) el.textContent = v; }); }
async function chargerDistant() {
  if (!SB) return;
  try {
    const rs = await Promise.all([SB.from('categories').select('id, nom, accroche, couleur').eq('actif', true).order('ordre'),
      SB.from('techniques').select('id, nom, detail').eq('actif', true).order('ordre'), SB.from('produits').select('*').eq('actif', true).order('ordre'),
      SB.from('textes').select('cle, valeur'), SB.from('parametres').select('cle, valeur'),
      SB.from('promotions').select('*'), SB.from('pages').select('slug, titre, contenu, type, seo_titre, seo_description, publie, dans_pied, ordre').eq('publie', true).order('ordre')]);
    const err = rs.find(r => r.error); if (err) throw err.error;
    const [c, te, p, tx, pa, pr, pg] = rs.map(r => r.data);
    PROMOS = pr.filter(x => TARIF.enCours(x)); PAGES_SITE = pg;
    const pm = Object.fromEntries(pa.map(x => [x.cle, x.valeur]));
    if (pm.accueil) ACCUEIL = pm.accueil; if (pm.seo) SEO = pm.seo;
    if (c.length) CATS = c;
    if (te.length) TECH = Object.fromEntries(te.map(x => [x.id, {nom: x.nom, detail: x.detail}]));
    if (p.length) PRODS = p.map(depuisDb).map(x => Object.assign(x, {tech: x.tech.filter(t => TECH[t])})).filter(x => x.tech.length && CATS.some(k => k.id === x.cat));
    tx.forEach(x => { TEXTES[x.cle] = x.valeur; });
    CFG = Object.assign({}, CFG, Object.fromEntries(pa.map(x => [x.cle, x.valeur])));
    indexer(); loadCart(); updateCount(); buildNav(); buildFooter(); appliquerTextes(); renderAnnonce(); route();
  } catch (e) { if (window.console) console.warn('Catalogue en ligne indisponible, version locale affichée.', e); }
}

function copyText(text) {
  const done = () => toast('Récapitulatif copié');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copie impossible, sélectionnez le texte manuellement'); } ta.remove();
}

function viewInfos() {
  const usedBy = k => CATS.filter(c => PRODS.some(p => p.cat === c.id && p.tech.includes(k))).map(c => c.nom).join(', ');
  const col = {laser: 'mag', uv: 'cya', alim: 'ora', '3d': 'blu', dtf: 'blu'};
  return `<div class="wrap">${crumbs([['Accueil', '#/'], ['Savoir-faire & livraison', '']])}
    <div class="cat-head"><p class="eyebrow">L'atelier</p><h1>Savoir-faire &amp; livraison</h1><p>${esc(T('infos_intro'))}</p></div>
    <div class="cols2">${Object.entries(TECH).map(([k, t]) => `<div class="tile" data-c="${col[k]}"><p class="eyebrow" style="color:var(--c-l)">${PRODS.filter(p => p.tech.includes(k)).length} produits</p><h3>${esc(t.nom)}</h3><p>${esc(t.detail)}.</p><p class="hint">Univers : ${esc(usedBy(k))}</p><a href="#/c/tous?t=${k}">Voir les produits</a></div>`).join('')}</div>
    <section class="block"><div class="sec-head"><div><p class="eyebrow">Commander</p><h2>De la demande à la livraison</h2></div></div>
      <div class="steps"><div><b>Composez votre devis</b>Produits, quantités, options et logo.</div><div><b>Recevez le BAT</b>Sous 24 à 48 h ouvrées, une modification incluse.</div><div><b>Validez et réglez</b>Particuliers à la commande, pros avec 50 % d'acompte.</div><div><b>Production et envoi</b>2 à 5 jours ouvrés, express 24 h possible.</div></div></section>
    <section class="block"><div class="sec-head"><div><p class="eyebrow">Livraison</p><h2>Martinique, Guadeloupe, Guyane</h2></div></div>
      <table class="ship"><thead><tr><th scope="col">Destination</th><th scope="col">Conditions</th><th scope="col">TVA</th></tr></thead><tbody>
      ${DEST.map(d => `<tr><td>${esc(d.nom)}</td><td data-l="Conditions">${esc(livr(d))}</td><td data-l="TVA">${CFG.tva[d.tva] ? String(CFG.tva[d.tva] * 100).replace('.', ',') + ' %' : 'Non applicable'}</td></tr>`).join('')}
      </tbody></table><p class="hint" style="margin-top:10px">Octroi de mer appliqué selon la réglementation en vigueur. Délais indicatifs après validation du BAT.</p></section>
    <section class="block"><div class="sec-head"><div><p class="eyebrow">Fichiers</p><h2>Préparer votre visuel</h2></div></div>
      <div class="cols2"><div class="tile"><h3>Formats acceptés</h3><p>Logo vectoriel (PDF, AI, SVG, EPS) ou image PNG en 300 dpi. Pour l'alimentaire, une photo nette en 200 dpi minimum suffit.</p></div><div class="tile"><h3>Pas de fichier ?</h3><p>La mise au propre d'un logo simple est offerte. Pour une création complète, un forfait est indiqué sur le devis.</p></div></div></section>
  </div>`;
}

/* --- Routeur --- */
function parse() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const [a, b] = path.split('/');
  return {a: a || '', b: b ? decodeURIComponent(b) : '', params: new URLSearchParams(qs || '')};
}
function route() {
  const r = parse();
  let page = 'home', label = 'Accueil', html, after = null, meta = null;
  if (RECUP) { $('app').innerHTML = viewMotDePasse(); setActive('compte', 'Nouveau mot de passe'); bindMotDePasse(); return; }
  if (r.a === 'c' && (r.b === 'tous' || catById[r.b])) {
    const t = r.params.get('t'); if (t && TECH[t]) { F.tech = new Set([t]); }
    page = 'c-' + r.b; label = r.b === 'tous' ? 'Tout le catalogue' : catById[r.b].nom;
    html = viewCatalog(r.b, ''); after = bindCatalog;
  } else if (r.a === 'recherche' && r.b) {
    page = 'c-tous'; label = 'Recherche'; html = viewCatalog('tous', r.b); after = bindCatalog;
  } else if (r.a === 'p' && byRef[r.b]) {
    const p = byRef[r.b]; page = 'c-' + p.cat; label = p.nom; html = viewProduct(p); after = () => bindProduct(p);
  } else if (r.a === 'compte') {
    page = 'compte'; label = 'Mon compte'; html = viewCompte(r.params); after = () => bindCompte(r.params);
  } else if (r.a === 'devis') {
    page = 'devis'; label = 'Mon devis'; html = viewQuote(); after = bindQuote;
  } else if (r.a === 'infos') {
    page = 'infos'; label = 'Savoir-faire & livraison'; html = viewInfos();
  } else if (r.a === 'page' && PAGES_SITE.some(x => x.slug === r.b && x.publie !== false)) {
    const pg = PAGES_SITE.find(x => x.slug === r.b); page = 'page-' + pg.slug; label = pg.titre; html = viewPage(pg);
    meta = [pg.seo_titre || pg.titre + ' — ' + CFG.marque, pg.seo_description];
  } else {
    if (r.a) { try { history.replaceState(null, '', '#/'); } catch (e) {} }
    html = viewHome();
    meta = [SEO.titre || document.title, SEO.description];
  }
  $('app').innerHTML = html;
  setActive(page, label);
  if (r.a === 'p' && byRef[r.b]) meta = [byRef[r.b].nom + ' personnalisé — ' + CFG.marque, byRef[r.b].desc];
  if (meta) setMeta(meta[0], meta[1]);
  if (after) after();
  closeNav();
  try { window.scrollTo(0, 0); } catch (e) {}
}

function buildFooter() {
  $('foot').innerHTML = `<div><h2>${esc(CFG.marque)}</h2><p style="margin-top:10px">${esc(T('pied_presentation'))}</p><p style="margin-top:10px">${esc(CFG.adresse)}</p></div>
    <div><h3>Univers</h3><ul>${CATS.slice(0, 4).map(c => `<li><a href="#/c/${c.id}">${esc(c.nom)}</a></li>`).join('')}</ul></div>
    <div><h3>&nbsp;</h3><ul>${CATS.slice(4).map(c => `<li><a href="#/c/${c.id}">${esc(c.nom)}</a></li>`).join('')}</ul></div>
    <div><h3>Contact</h3><ul><li>${esc(CFG.telephone)}</li>${CFG.email ? `<li><a href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a></li>` : ''}<li><a href="#/infos">Savoir-faire &amp; livraison</a></li><li><a href="#/devis">Mon devis</a></li></ul></div>`;
  const pied = PAGES_SITE.filter(p => p.publie !== false && p.dans_pied !== false);
  $('legal').innerHTML = pied.length ? `<nav aria-label="Informations légales" style="display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:8px">${pied.map(p => `<a href="#/page/${esc(p.slug)}">${esc(p.titre)}</a>`).join('')}</nav><span id="legal-t"></span>` : '<span id="legal-t"></span>';
  $('legal-t').textContent = `© ${new Date().getFullYear()} ${CFG.marque} · Prix unitaires HT indicatifs, devis définitif après BAT · Livraison Martinique, Guadeloupe, Guyane`;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('modal').hidden) fermerModal(false); else closeNav(); } });
$('modal').addEventListener('click', e => { if (e.target === $('modal')) fermerModal(false); });
if (typeof window.matchMedia === 'function') {
  const wide = window.matchMedia('(min-width: 901px)');
  const onWide = e => { if (e.matches) closeNav(); };
  if (wide.addEventListener) wide.addEventListener('change', onWide); else if (wide.addListener) wide.addListener(onWide);
} else {
  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeNav(); });
}
let x0 = null;
document.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => {
  if (x0 === null || !$('sidebar').classList.contains('open')) { x0 = null; return; }
  if (e.changedTouches[0].clientX - x0 < -55) closeNav();
  x0 = null;
}, {passive: true});
window.addEventListener('hashchange', route);

loadCart(); buildNav(); buildFooter(); updateCount(); appliquerTextes(); renderAnnonce(); route(); chargerLogo(route);
if (SB) {
  chargerMoi().then(() => { if (!RECUP) route(); });
  SB.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' || ev === 'SIGNED_IN') chargerMoi(); });
  chargerDistant();
} else { const a = $('acct-link'); if (a) a.textContent = 'Mon compte'; }
</script>
</body>
